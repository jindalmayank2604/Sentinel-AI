[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Local-first engineering signal intelligence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
sentinel-ai = "sentinel_ai.app.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
